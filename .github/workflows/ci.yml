name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.group }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - group: smoke
            tags: "smoke"
          - group: positive
            tags: "positive"
          - group: negative
            tags: "negative"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run ${{ matrix.group }} tests
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: mvn clean test -Papi -Dgroups="${{ matrix.tags }}"

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.group }}
          path: target/site/allure-maven-plugin

  publish-reports:
    name: Publish Allure Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: gh-pages

      - name: Create index.html with links
        run: |
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Allure Reports - Yandex API Tests</title>
              <style>
                  body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; text-align: center; }
                  h1 { color: #333; }
                  a { display: inline-block; margin: 10px; padding: 15px 30px; background: #007acc; color: white; text-decoration: none; border-radius: 5px; }
                  a:hover { background: #005f99; }
              </style>
          </head>
          <body>
              <h1>Allure Reports for Yandex API Tests (Real API)</h1>
              <a href="allure-report-smoke/">Smoke</a>
              <a href="allure-report-positive/">Positive</a>
              <a href="allure-report-negative/">Negative</a>
          </body>
          </html>
          EOF

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Allure reports" || echo "No changes to commit"
          git push
